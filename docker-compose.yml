services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: multimodal
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Backend/API/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: multimodal
      DB_USER: postgres
      DB_PASSWORD: 123456
      DATASET_SIZE: "1000"
    ports:
      - "8000:8000"
    volumes:
      - ./Backend/Multimodal/Data:/app/Backend/Multimodal/Data

  frontend:
    build:
      context: Fronted
    depends_on:
      - backend
    environment:
      VITE_API_PROXY: http://backend:8000
    ports:
      - "5173:5173"

volumes:
  pgdata:
